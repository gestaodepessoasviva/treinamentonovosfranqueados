<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIVA Academy: protótipo da gamificação</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2540;--mut:#5d6785;--line:#dde1ef;--brand:#1d2540;--bink:#fff;--teal:#0f8b7d;--tealb:#dff4f0;--gold:#c58a00;--goldb:#fff3cc;--coral:#d9534f;--coralb:#fde6e3;--btn:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162a;--card:#1b2140;--ink:#eef0fa;--mut:#a3abc9;--line:#2c3562;--brand:#0b0f20;--bink:#eef0fa;--teal:#3fc6b5;--tealb:#12353a;--gold:#f2c038;--goldb:#3a3215;--coral:#ff7f7a;--coralb:#3a1f27;--btn:#0d1224}}
:root[data-theme="dark"]{--bg:#12162a;--card:#1b2140;--ink:#eef0fa;--mut:#a3abc9;--line:#2c3562;--brand:#0b0f20;--bink:#eef0fa;--teal:#3fc6b5;--tealb:#12353a;--gold:#f2c038;--goldb:#3a3215;--coral:#ff7f7a;--coralb:#3a1f27;--btn:#0d1224}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif}
h1{font-size:24px;margin:0 0 4px;font-weight:800}h2{font-size:18px;margin:22px 0 8px}
main{max-width:640px;margin:0 auto;padding:68px 16px 28px}
.mut{color:var(--mut);font-size:14px}.sm{font-size:12px}
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--brand);color:var(--bink)}
.top b{font-size:17px;flex:1}
.ib,.av{position:relative;width:42px;height:42px;border:0;border-radius:50%;background:#ffffff22;color:var(--bink);font-size:20px;cursor:pointer}
.av{background:var(--teal);color:var(--btn);font:800 15px Nunito,sans-serif}
.dot{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font:800 11px/18px Nunito,sans-serif;font-style:normal}
.ov{position:fixed;inset:0;background:#0009;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(82vw,300px);z-index:40;background:var(--card);color:var(--ink);padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 16px;display:flex;flex-direction:column;gap:4px;transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
.dr.on{transform:none;visibility:visible}
.dr h3{margin:0 8px 10px;font-size:18px}
.mi{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border:0;border-radius:10px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.mi.on{background:var(--tealb);font-weight:800}.mi.out{margin-top:auto;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.hl{border-left:5px solid var(--teal)}
.bar{height:10px;border-radius:6px;background:var(--line);margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:6px}
.tl{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:10px}.tl span{height:8px;border-radius:4px;background:var(--line)}.tl .d{background:var(--teal)}.tl .n{background:var(--gold)}
.tll{display:grid;grid-template-columns:repeat(3,1fr);font-size:11px;color:var(--mut);margin-top:4px}
.big{font-size:40px;font-weight:800;line-height:1.1}.big small{font-size:16px;font-weight:600}
.go{margin-top:10px;padding:12px 20px;border:0;border-radius:10px;background:var(--teal);color:var(--btn);font:inherit;font-weight:800;cursor:pointer}
.go:disabled{background:var(--line);color:var(--mut);cursor:default}.w{width:100%}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.back{display:inline-flex;align-items:center;gap:6px;margin:4px 0 10px;padding:8px 14px;border:2px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.map.sm{width:68%;margin:10px auto}.map.sm .nd{border-width:2px;font-size:9px;line-height:1;width:8%}.map.sm .pin{font-size:7px;padding:3px 5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 14px;border-radius:12px;background:var(--line)}
.seg button{padding:8px;border:0;border-radius:9px;background:none;color:var(--mut);font:600 13px Nunito,sans-serif;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 1px 3px #0002}
.lv{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.lv:last-child{border:0}
.lv b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--line)}
.lv.done b{background:var(--teal);color:var(--btn)}.lv.cur{font-weight:800}.lv.cur b{background:var(--gold);color:#fff}.lv small{margin-left:auto;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.pl{color:var(--teal);font-weight:800;white-space:nowrap}.mn{color:var(--coral);font-weight:800}
.tag{font-size:11px;font-weight:800;padding:1px 8px;border-radius:10px;background:var(--tealb);margin-right:6px}
.chip{font-size:12px;font-weight:800;padding:2px 10px;border-radius:10px;white-space:nowrap}
.cp{background:var(--goldb);color:var(--gold)}.cv{background:var(--tealb);color:var(--teal)}.ca{background:var(--coralb);color:var(--coral)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .card{margin:0;text-align:center}
.em{font-size:34px}.lock{opacity:.4;filter:grayscale(1)}
.nt{display:flex;gap:12px;align-items:flex-start}.nt.new{border-left:5px solid var(--gold)}
.pf{text-align:center}.pf .av{display:grid;place-items:center;width:84px;height:84px;font-size:30px;cursor:default;margin:0 auto 8px}
label{display:block;margin:12px 0 0;font-weight:600;font-size:14px}
input{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.login{min-height:80vh;display:grid;place-items:center}.login .card{width:100%;padding:22px}
.lk{display:block;margin:12px auto 0;background:none;border:0;color:var(--teal);font:inherit;cursor:pointer;text-decoration:underline}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:50;background:var(--brand);color:var(--bink);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}#toast.on{opacity:1}
:root{--bg:#f5f5f5;--card:#fff;--ink:#111;--mut:#595959;--line:#e2e2e2;--brand:#111;--bink:#fff;--teal:#d9480f;--tealb:#ffe8d9;--gold:#b45309;--goldb:#ffedd5;--coral:#c92a2a;--coralb:#fde8e8;--btn:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--card:#1a1a1a;--ink:#f5f5f5;--mut:#a8a8a8;--line:#2e2e2e;--brand:#000;--bink:#fff;--teal:#ff8a3d;--tealb:#3a2412;--gold:#ffb366;--goldb:#3a2a14;--coral:#ff7b72;--coralb:#3a1f1f;--btn:#111}}
:root[data-theme="dark"]{--bg:#0e0e0e;--card:#1a1a1a;--ink:#f5f5f5;--mut:#a8a8a8;--line:#2e2e2e;--brand:#000;--bink:#fff;--teal:#ff8a3d;--tealb:#3a2412;--gold:#ffb366;--goldb:#3a2a14;--coral:#ff7b72;--coralb:#3a1f1f;--btn:#111}
.cv{background:var(--ink);color:var(--bg)}
.mis{margin:14px 0;padding:18px;border-radius:18px;background:linear-gradient(135deg,#ffb347,#ff7a1a);color:#111;box-shadow:0 6px 18px #ff7a1a55}
.mt{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.mb{font-size:24px;font-weight:800;line-height:1.2;margin:6px 0}
.md{font-size:15px}
.go2{margin-top:12px;padding:12px 20px;border:0;border-radius:12px;background:#111;color:#fff;font:inherit;font-weight:800;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.fl{display:inline-block;animation:pl 1.4s ease-in-out infinite}}
@keyframes pl{50%{transform:scale(1.25)}}

.map{position:relative;width:100%;aspect-ratio:1448/1086;border-radius:16px;overflow:hidden;background:#1b7fc4;box-shadow:0 4px 16px #0003;margin:10px 0}
.map img{display:block;width:100%;height:100%}
.sd{position:absolute;width:36%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#0a1a2ecc 0,#0a1a2e88 45%,transparent 70%);pointer-events:none}
.nd{position:absolute;transform:translate(-50%,-50%);width:6.4%;aspect-ratio:1;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;padding:0;font:800 clamp(11px,3.2vw,19px) Nunito,sans-serif;cursor:pointer;color:#fff;box-shadow:0 2px 8px #0008}
.nd.d{background:#d9480f}.nd.c{background:#ff7a1a}.nd.a{background:#fff;color:#111}.nd.l{background:#111}
.nd.sel{box-shadow:0 0 0 4px #ffb347,0 2px 8px #0008}
.pin{position:absolute;bottom:128%;left:50%;transform:translateX(-50%);background:#ffb347;color:#111;font:800 clamp(8px,2.3vw,12px)/1 Nunito,sans-serif;padding:5px 8px;border-radius:8px;white-space:nowrap;box-shadow:0 2px 6px #0007}
.pin::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#ffb347}
@media (prefers-reduced-motion:no-preference){.nd.c{animation:pp 1.6s infinite}@keyframes pp{0%{box-shadow:0 0 0 0 #ff7a1acc}100%{box-shadow:0 0 0 16px #ff7a1a00}}}
.chs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.ch{flex:none;padding:8px 12px;border:2px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.ch.on{border-color:var(--teal);font-weight:800}
.cl{background:var(--line);color:var(--mut)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0}summary{font-weight:800;cursor:pointer}
</style></head>
<body><div id="app"></div><div id="toast" role="status"></div>
<script>
const $=q=>document.querySelector(q);
const U={n:"Ana Souza",f:"VIVA Exemplo"};
const N=[["Largada",0],["Em rota",500],["Na estrada",1200],["Reta final",2200],["Formado",3500]];
const R=[["Aprender","Concluir conteúdo no Academy","+80","bônus +20 no prazo"],["Aprender","Passar no quiz (80% ou mais)","+30",""],["Participar","Aula ao vivo (presença mínima)","+50","aula gravada +25"],["Aplicar","Missão de campo validada","+120",""],["Aplicar","Projeto integrador aprovado","+200","bônus +30 no prazo"],["Evoluir","Aprovação na prova da fase","+150","1ª tentativa +50"],["Evoluir","Concluir uma fase","+300",""]];
const B=[["Live exclusiva com a diretoria",300,"🎤"],["Kit VIVA",600,"🎁"],["Mentoria com franqueado veterano",800,"🤝"],["Convite para evento da rede",1500,"🎟️"]];
const Q=[["Largada","🚩"],["Visão de mercado","🔭"],["Formado na VIVA","🎓"],["Pronto pra abrir","🔑"],["Voz no comercial","📣"],["Cliente em foco","🎯"],["Cliente na mão","🤲"],["Mão na massa","🛠️"]];
const NT=[["🏅","Nova conquista: Pronto pra abrir","hoje"],["⭐","+100 pontos! Você concluiu Modelo de Negócio dentro do prazo.","hoje"],["⏰","A trilha de Vendas vence em 3 dias.","ontem"],["✅","Sua missão de campo foi validada pelo SAF.","há 5 dias"]];
const M=[["inicio","🏠","Início"],["jornada","🗺️","Minha Jornada"],["pontos","⭐","Pontos"],["benef","🎁","Benefícios"],["conq","🏅","Conquistas"],["guia","📖","Guia da Jornada"]];
let s={lay:'A',cur:2,node:2,in:0,v:"inicio",m:0,pts:1480,un:2,seen:2,ex:[["19/10","Concluiu Modelo de Negócio no prazo",100],["17/10","Aula ao vivo 6: presença",50],["15/10","Missão de campo validada (SAF)",120],["12/10","Quiz da aula 5: 90%",30],["08/10","Aula ao vivo 5: presença",50]]};
const f=n=>n.toLocaleString("pt-BR");
const lv=()=>N.reduce((a,n,i)=>s.pts>=n[1]?i:a,0);
Object.defineProperty(window,"got",{get:()=>Math.min(8,2+s.cur)});
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2600)}
function go(v){s.v=v;s.m=0;if(v=="notif"){s.seen=s.un;s.un=0}render();scrollTo(0,0)}
function tm(){s.m=!s.m;render()}
function enter(){s.in=1;render()}
function out(){s.in=0;s.m=0;s.v="inicio";render()}
function troca(i){const b=B[i];if(s.pts<b[1])return;s.pts-=b[1];s.ex.unshift(["Hoje","Troca: "+b[0],-b[1]]);render();toast("Troca solicitada! O T&D vai aprovar.")}
const pr=(a,t,p)=>`<div class="row"><span>${a}</span><b>${t}</b></div><div class="bar"><i style="width:${p}%"></i></div>`;
const chip=(c,t)=>`<span class="chip ${c}">${t}</span>`;
function home(){const l=lv();return `<div class="seg" role="group" aria-label="Teste de layout"><button class="${s.lay=="A"?"on":""}" onclick="s.lay='A';render()">A · Missão no topo</button><button class="${s.lay=="B"?"on":""}" onclick="s.lay='B';render()">B · Mapa compacto</button></div><div class="mut">Olá,</div><h1>${U.n}</h1><div class="mut">${U.f} · Nível ${l+1} ${N[l][0]} · <b>${f(s.pts)} pontos</b></div>
${s.lay=="A"?`<section class="mis"><div class="mt"><span class="fl">🔥</span> Sua próxima missão</div><div class="mb">Concluir a trilha de Vendas</div><div class="md">⏰ Prazo: 30/10 · 🎯 <b>+100 pontos</b></div><button class="go2" onclick="toast('Na versão final: abre a trilha no Academy')">Ir para a missão →</button></section>
<section class="card"><div class="mut">Próxima aula</div><b>29/10 · 09h · Aula 7: Vendas</b></section>
`+mapCard():mapCard(1)+`<section class="mis"><div class="mt"><span class="fl">🔥</span> Sua próxima missão</div><div class="mb">Concluir a trilha de Vendas</div><div class="md">⏰ Prazo: 30/10 · 🎯 <b>+100 pontos</b></div><button class="go2" onclick="toast('Na versão final: abre a trilha no Academy')">Ir para a missão →</button></section>
<section class="card"><div class="mut">Próxima aula</div><b>29/10 · 09h · Aula 7: Vendas</b></section>
`}
<section class="card"><b>Seu progresso na fase</b>${pr("Academy","78%",78)}${pr("Aulas ao vivo","6 de 7",86)}${pr("Avaliações","4 de 5",80)}</section>
<section class="card"><b>Pendências</b><div class="row"><span>Trilha de Vendas</span>${chip("cp","Pendente")}</div><div class="row"><span>Missão: 2ª reunião comercial</span>${chip("cv","Em validação")}</div></section>
`}
function pontos(){const l=lv(),n=N[l+1],c=N[l][1];return `<h1>Pontos</h1>
<section class="card"><div class="mut">Seu saldo</div><div class="big">${f(s.pts)} <small>pontos</small></div>${n?`<div class="bar"><i style="width:${Math.min(100,(s.pts-c)/(n[1]-c)*100)}%"></i></div><div class="mut">Faltam ${f(Math.max(0,n[1]-s.pts))} pontos para o nível ${l+2} (${n[0]})</div>`:`<div class="mut">Nível máximo!</div>`}<button class="go" onclick="go('benef')">Trocar pontos</button><div class="mut sm" style="margin-top:8px">Última atualização: hoje, 08h</div></section>
<h2>Níveis</h2><section class="card">${N.map((n,i)=>`<div class="lv ${i<l?"done":i==l?"cur":""}"><b>${i<l?"✓":i+1}</b><span>${n[0]}</span><small>${f(n[1])}+ pts</small></div>`).join("")}</section>
<h2>Como acumular pontos</h2><section class="card">${R.map(r=>`<div class="row"><span><span class="tag">${r[0]}</span>${r[1]}${r[3]?`<br><span class="mut sm">${r[3]}</span>`:""}</span><span class="pl">${r[2]}</span></div>`).join("")}</section>
<h2>Extrato</h2><section class="card">${s.ex.map(e=>`<div class="row"><span>${e[1]}<br><span class="mut sm">${e[0]}</span></span><span class="${e[2]>0?"pl":"mn"}">${e[2]>0?"+":""}${e[2]}</span></div>`).join("")}</section>`}
function benef(){return `<h1>Benefícios</h1><p class="mut">Seu saldo: <b>${f(s.pts)} pontos</b></p>`+B.map((b,i)=>`<section class="card nt"><span class="em">${b[2]}</span><div style="flex:1"><b>${b[0]}</b><div class="mut">${f(b[1])} pontos</div><button class="go" ${s.pts<b[1]?"disabled":""} onclick="troca(${i})">${s.pts<b[1]?"Faltam "+f(b[1]-s.pts)+" pts":"Trocar"}</button></div></section>`).join("")}
function conq(){return `<h1>Conquistas</h1><p class="mut">${got} de ${Q.length} desbloqueadas</p><div class="grid">${Q.map((q,i)=>`<div class="card ${i<got?"":"lock"}"><div class="em">${q[1]}</div><b>${q[0]}</b><div class="mut sm">${i<got?"Conquistada":"Bloqueada"}</div></div>`).join("")}</div>`}
function notif(){return `<h1>Notificações</h1>`+NT.map((n,i)=>`<section class="card nt ${i<s.seen?"new":""}"><span class="em" style="font-size:24px">${n[0]}</span><div><div>${n[1]}</div><div class="mut sm">${n[2]}</div></div></section>`).join("")+`<p class="mut sm">Na versão final, cada pessoa escolhe quais avisos quer receber.</p>`}
